<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>face-auth demo</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#111}
  input,button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #ccc}
  button{background:#111;color:#fff;border:0;cursor:pointer;margin-right:6px}
  pre{background:#f5f5f5;padding:12px;border-radius:8px;white-space:pre-wrap;word-break:break-all;font-size:12px}
  .note{color:#666;font-size:14px}
</style>
</head>
<body>
<h1>face-auth demo</h1>
<p class="note">Sadece geliştirme modunda çalışır (FACEAUTH_API_KEYS boşken). Gerçek projede
challenge'ı tarayıcı değil, projenin backend'i API anahtarıyla oluşturur.</p>
<p><input id="uid" value="demo-user" placeholder="kullanıcı id"></p>
<p>
  <button onclick="go('enroll')">1) Yüzümü kaydet</button>
  <button onclick="go('verify')">2) Doğrula (withdraw)</button>
</p>
<pre id="out">—</pre>
<script src="/faceauth.js"></script>
<script>
const out = document.getElementById("out");
async function go(purpose) {
  out.textContent = "...";
  try {
    const r = await fetch("/v1/challenges", {method: "POST", headers: {"content-type": "application/json"},
      body: JSON.stringify({user_id: document.getElementById("uid").value, purpose, scope: "withdraw"})});
    const challenge = await r.json();
    if (!r.ok) throw new Error(challenge.message);
    const res = await FaceAuth.run({serviceUrl: "", challenge});
    if (res.token) {
      const claims = JSON.parse(atob(res.token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
      out.textContent = "TOKEN CLAIMS:\n" + JSON.stringify(claims, null, 2);
    } else out.textContent = JSON.stringify(res, null, 2);
  } catch (e) { out.textContent = "Hata: " + e.message; }
}
</script>
</body>
</html>
